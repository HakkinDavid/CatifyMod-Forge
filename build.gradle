plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '7.0.17'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', 'src/client/java']
        }
        resources {
            srcDirs = ['src/main/resources', 'src/client/resources']
        }
    }
}

configurations {
    annotationProcessor.extendsFrom compileClasspath
}

repositories {
    minecraft.mavenizer(it)
    mavenCentral()
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}")
    implementation "net.minecraftforge:eventbus:7.0.1"
    annotationProcessor "org.spongepowered:mixin:0.8.7:processor"
}

minecraft {
    mappings channel: project.mappings_channel, version: project.mappings_version

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
        }

        register('client') {
            jvmArgs '-XstartOnFirstThread'
        }
        register('server') {
            args '--nogui'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll([
        "-AoutRefMapFile=${projectDir}/src/main/resources/catify.refmap.json",
        "-AdefaultObfuscationEnv=searge"
    ])
}

java {
    withSourcesJar()
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

jar {
    inputs.property "archivesName", project.base.archivesName

    manifest {
        attributes(
                'MixinConfigs': 'catify.mixins.json,catify.client.mixins.json'
        )
    }

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}

tasks.register('printMainClasspath') {
    doLast {
        println("compileClasspath files:")
        configurations.compileClasspath.files.each { f ->
            println(" - " + f.absolutePath)
        }
    }
}

tasks.register('printEntityRendererMethods') {
    doLast {
        def cp = configurations.compileClasspath.files.collect { it.toURI().toURL() } as URL[]
        def cl = new URLClassLoader(cp, ClassLoader.systemClassLoader)
        try {
            def clazz = cl.loadClass('net.minecraft.client.renderer.entity.EntityRenderer')
            println("Class found: " + clazz.name)
            clazz.declaredMethods.each { m ->
                println(" - " + m.toString())
            }
        } catch (Exception e) {
            e.printStackTrace()
        }
    }
}